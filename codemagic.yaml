# CinePlayer: eigen app van Jawad (native SwiftUI, map Native/), ad hoc op zijn eigen iPhone.
# Bouwt in de Codemagic-app valorem-ios (tak cineplayer), zodat de sleutels uit
# de groep valorem_appstore gebruikt worden. De IPA gaat naar
# https://valorembelastingadvies.nl/installeer/cineplayer (openen in Safari).

workflows:
  cineplayer-direct:
    name: CinePlayer direct op je iPhone
    max_build_duration: 40
    instance_type: mac_mini_m2
    environment:
      groups:
        - valorem_appstore
      vars:
        BUNDLE_ID: nl.jawad.cineplayer
        XCODE_PROJECT: Native/CinePlayer.xcodeproj
        XCODE_SCHEME: CinePlayer
        SITE: https://valorembelastingadvies.nl
      xcode: 27.0
    scripts:
      - name: Sleutels
        script: |
          set -eo pipefail
          pem() {
            if printf %s "$1" | grep -q -- "-----BEGIN"; then printf %s "$1"; echo
            else echo "-----BEGIN $2-----"; printf %s "$1" | tr -d "[:space:]" | fold -w 64; echo; echo "-----END $2-----"; fi
          }
          mkdir -p "$HOME/sleutels"
          pem "$APP_STORE_CONNECT_PRIVATE_KEY" "PRIVATE KEY" > "$HOME/sleutels/asc.p8"
          pem "$CERTIFICATE_PRIVATE_KEY" "RSA PRIVATE KEY" > "$HOME/sleutels/cert.pem"
          python3 -c "import jwt" 2>/dev/null || pip3 install --quiet pyjwt cryptography
          cat > "$HOME/teken.py" <<'PY'
          import hashlib, os, sys, time, jwt
          doel = sys.argv[1]
          nu = int(time.time())
          inhoud = {'aud': doel, 'iat': nu, 'exp': nu + 900}
          if len(sys.argv) > 2:
              inhoud['sha256'] = hashlib.sha256(open(sys.argv[2], 'rb').read()).hexdigest()
              inhoud['versie'] = os.environ.get('VERSIE', '')
              inhoud['build'] = os.environ.get('NUMMER', '')
              inhoud['commit'] = os.environ.get('CM_COMMIT', '')[:7]
          sleutel = open(os.path.expanduser('~/sleutels/asc.p8')).read()
          print(jwt.encode(inhoud, sleutel, algorithm='ES256'))
          PY
      - name: Toestellen aanmelden bij Apple
        script: |
          set -eo pipefail
          TOKEN=$(python3 "$HOME/teken.py" valorem-toestellen)
          curl -sf -H "Authorization: Bearer $TOKEN" "$SITE/toestel/lijst" > toestellen.json
          python3 -c "import json; [print(t['udid'], t['product'] or 'iPhone') for t in json.load(open('toestellen.json'))['toestellen']]" > toestellen.txt
          echo "Aangemeld via de site: $(wc -l < toestellen.txt) toestel(len)"
          if [ ! -s toestellen.txt ]; then
            echo "Nog geen toestel. Open eerst $SITE/toestel in Safari op de iPhone."; exit 1
          fi
          while read -r UDID PRODUCT; do
            app-store-connect devices register --name "Valorem $PRODUCT" --udid "$UDID" --platform IOS \
              --ignore-registration-errors \
              --issuer-id @env:APP_STORE_CONNECT_ISSUER_ID \
              --key-id @env:APP_STORE_CONNECT_KEY_IDENTIFIER \
              --private-key "@file:$HOME/sleutels/asc.p8" || echo "al aangemeld: $UDID"
          done < toestellen.txt
      - name: Ondertekening (ad hoc)
        script: |
          set -eo pipefail
          ASC="--issuer-id @env:APP_STORE_CONNECT_ISSUER_ID --key-id @env:APP_STORE_CONNECT_KEY_IDENTIFIER --private-key @file:$HOME/sleutels/asc.p8"
          app-store-connect bundle-ids create "$BUNDLE_ID" --name "CinePlayer" --platform IOS $ASC || echo "bundel-ID bestaat al"
          # Alleen oude ad hoc-profielen van CinePlayer weg, zodat alle toestellen erin komen.
          app-store-connect profiles list --json $ASC > profielen.json || echo "[]" > profielen.json
          python3 -c "
          import json
          for p in json.load(open('profielen.json')):
              a = p.get('attributes', {})
              if a.get('profileType') == 'IOS_APP_ADHOC' and 'cineplayer' in a.get('name', '').lower():
                  print(p['id'])" > oud.txt || true
          while read -r ID; do
            app-store-connect profiles delete "$ID" $ASC || true
          done < oud.txt
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_ADHOC --create --strict-match-identifier \
            $ASC --certificate-key "@file:$HOME/sleutels/cert.pem"
          keychain add-certificates
          xcode-project use-profiles
      - name: Buildnummer
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" "$XCODE_PROJECT/project.pbxproj"
          echo "NUMMER=$BUILD_NUMBER" >> $CM_ENV
          echo "VERSIE=2.0" >> $CM_ENV
      - name: Bouwen
        script: |
          mkdir -p build
          if xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME" > build/bouw.log 2>&1; then
            tail -n 5 build/bouw.log
          else
            echo "=== FOUTEN ==="
            grep -h -A 4 "error:" build/bouw.log /tmp/xcodebuild_logs/*.log 2>/dev/null | grep -v "^--$" | head -n 120
            exit 65
          fi
      - name: Naar de installeerpagina
        script: |
          set -eo pipefail
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          TOKEN=$(python3 "$HOME/teken.py" cineplayer-installeer "$IPA")
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/octet-stream" \
            --data-binary @"$IPA" "$SITE/installeer/cineplayer/upload"
          echo
          echo "Klaar. Installeren op de iPhone: $SITE/installeer/cineplayer (in Safari)"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
