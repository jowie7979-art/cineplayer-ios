<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CinePlayer — iPhone preview</title>
<style>
  body { margin: 0; background: #1a1a1a; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; }
  .frame {
    width: 390px;
    height: 844px;
    border-radius: 44px;
    background: #000;
    box-shadow: 0 0 0 10px #2a2a2a, 0 0 0 12px #111, 0 30px 80px rgba(0,0,0,.8);
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }
  iframe { width: 100%; height: 100%; border: none; display: block; }
  .notch {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 120px; height: 32px; background: #000; border-radius: 0 0 20px 20px; z-index: 10;
  }
</style>
</head>
<body>
<div class="frame">
  <div class="notch"></div>
  <iframe src="http://localhost:3001/index.html"></iframe>
</div>
</body>
</html>
